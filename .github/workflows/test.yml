name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - name: Chromium smoke
        run: npm run test:browser && npm run test:debug
      - name: Firefox lint and smoke
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          npx web-ext lint --source-dir dist/firefox
          npm run test:firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-verification
          path: output/verification/
          if-no-files-found: ignore
          retention-days: 14

name: Package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: |
            dist/chromium
            dist/firefox
            dist/crossmark-chromium.zip
            dist/crossmark-firefox.xpi
          retention-days: 14

name: Sign release

on:
  release:
    types: [published]

concurrency:
  group: sign-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sign:
    name: Sign Firefox and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release configuration
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must be a numeric extension version, such as v0.0.4.'
            exit 1
          fi
          if [ -z "$VITE_CONVEX_URL" ] || [ -z "$VITE_CONVEX_SITE_URL" ]; then
            echo 'Set GitHub variables VITE_CONVEX_URL and VITE_CONVEX_SITE_URL before signing a release.'
            exit 1
          fi
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo 'Set GitHub secrets AMO_JWT_ISSUER and AMO_JWT_SECRET before signing a release.'
            exit 1
          fi
          echo "RELEASE_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Set extension version from release tag
        run: npm pkg set "version=$RELEASE_VERSION"
      - run: npm run package
      - name: Verify packaged versions
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const browser of ["chromium", "firefox"]) {
              const version = JSON.parse(readFileSync(`dist/${browser}/manifest.json`)).version;
              if (version !== process.env.RELEASE_VERSION) {
                throw new Error(`${browser} version ${version} differs from release ${process.env.RELEASE_VERSION}`);
              }
            }
          '
      - name: Sign Firefox
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/sign-firefox.mjs
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" dist/crossmark-chromium.zip dist/crossmark-firefox-signed.xpi --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: extension-signed
          path: |
            dist/crossmark-chromium.zip
            dist/signed/
            dist/crossmark-firefox-signed.xpi
          retention-days: 90
